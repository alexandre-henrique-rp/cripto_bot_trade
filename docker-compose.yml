services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - DATABASE_URL=${DATABASE_URL:-file:/data/crypto.db}
      - API_URL_PROD=${API_URL_PROD:-https://api.binance.com/api}
      - STREAM_URL_PROD=${STREAM_URL_PROD:-wss://stream.binance.com:9443/ws}
      - SYMBOL=${SYMBOL:-SOLUSDT}
      - API_KEY_PROD=${API_KEY_PROD}
      - SECRET_KEY_PROD=${SECRET_KEY_PROD}
      - BOT_TOKEN=${BOT_TOKEN}
      - CHAT_ID=${CHAT_ID}
    volumes:
      - crypto_data:/data
    command: ["node", "--experimental-strip-types", "-r", "dotenv/config", "index.ts"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      app:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL:-file:/data/crypto.db}
      - SKIP_DB_PUSH=1
      - API_URL_PROD=${API_URL_PROD:-https://api.binance.com/api}
      - STREAM_URL_PROD=${STREAM_URL_PROD:-wss://stream.binance.com:9443/ws}
      - SYMBOL=${SYMBOL:-SOLUSDT}
      - API_KEY_PROD=${API_KEY_PROD}
      - SECRET_KEY_PROD=${SECRET_KEY_PROD}
      - BOT_TOKEN=${BOT_TOKEN}
      - CHAT_ID=${CHAT_ID}
    volumes:
      - crypto_data:/data
    command: ["node", "--experimental-strip-types", "-r", "dotenv/config", "bot/index.ts"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  crypto_data:
